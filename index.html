<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cybernic — Gizlilik Politikası</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 40px 20px;
    background: #05050c; color: #d7e0ff;
    font: 16px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { color: #00f0ff; font-size: 28px; letter-spacing: 1px; margin-bottom: 4px; }
  h2 { color: #ff2daf; font-size: 19px; margin-top: 38px; }
  h3 { font-size: 16px; color: #ffe83d; margin-top: 26px; }
  a { color: #00f0ff; }
  hr { border: 0; border-top: 1px solid #23284a; margin: 32px 0; }
  code, .meta { color: #6e7bb8; }
  ul { padding-left: 22px; }
  li { margin: 6px 0; }
  strong { color: #fff; }
</style>
</head>
<body>
<main id="content">Yükleniyor…</main>
<script>
// Politika metni privacy-policy.md dosyasında tutulur; burada basitçe
// biçimlendirilerek gösterilir. Tek kaynak: markdown dosyası.
fetch('privacy-policy.md').then(r => r.text()).then(md => {
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const inline = s => esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/<(https?:[^>]+)>/g, '<a href="$1">$1</a>')
    .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2">$1</a>');
  const out = [];
  let inList = false;
  for (const line of md.split('\n')) {
    const li = line.match(/^- (.*)$/);
    if (li) { if (!inList) { out.push('<ul>'); inList = true; } out.push('<li>' + inline(li[1]) + '</li>'); continue; }
    if (inList) { out.push('</ul>'); inList = false; }
    if (/^### /.test(line)) out.push('<h3>' + inline(line.slice(4)) + '</h3>');
    else if (/^## /.test(line)) out.push('<h2>' + inline(line.slice(3)) + '</h2>');
    else if (/^# /.test(line)) out.push('<h1>' + inline(line.slice(2)) + '</h1>');
    else if (/^---\s*$/.test(line)) out.push('<hr>');
    else if (line.trim() === '') out.push('');
    else out.push('<p>' + inline(line) + '</p>');
  }
  if (inList) out.push('</ul>');
  document.getElementById('content').innerHTML = out.join('\n');
});
</script>
</body>
</html>
